# CRMEB 相关配置
crmeb:
  version: CRMEB-JAVA-SY-v3.1 # 当前代码版本
  imagePath: /你的站点绝对路径 建议jar包位置/ # 服务器图片路径配置 斜杠结尾
  asyncConfig: false #是否同步config表数据到redis
  jwt-secret: # JWT签名密钥，请配置随机密钥（如 openssl rand -hex 32）；也可用环境变量 CRMEB_JWT_SECRET；留空时启动自动生成临时密钥（重启后需重新登录）

server:
  port: 20610

spring:
  profiles:
    #  配置的环境
    active: dev
    #  数据库配置
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/java_dev?characterEncoding=utf-8&useSSL=false&serverTimeZone=GMT+8
    username: java_dev
    password: 111111
  redis:
    host: 127.0.0.1 #地址
    port: 6379 #端口
    password: 111111
    timeout: 10000 # 连接超时时间（毫秒）
    database: 10 #默认数据库
    jedis:
      pool:
        max-active: 200 # 连接池最大连接数（使用负值表示没有限制）
        max-wait: -1 # 连接池最大阻塞等待时间（使用负值表示没有限制）
        max-idle: 10 # 连接池中的最大空闲连接
        min-idle: 0 # 连接池中的最小空闲连接
        time-between-eviction-runs: -1 #逐出扫描的时间间隔(毫秒) 如果为负数,则不运行逐出线程, 默认-1
